<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supercar Race - First to 100 Wins!</title>
<style>
  body {
    margin: 0;
    background: #0f172a;
    color: #fff;
    font-family: sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  h1 { margin: 5px 0; color: #feca57; }
  p { margin: 0 0 10px 0; font-size: 14px; opacity: 0.8; }
  .hud {
    display: flex;
    gap: 20px;
    margin-bottom: 10px;
    font-size: 18px;
    font-weight: bold;
  }
  .p1-box { color: #38bdf8; }
  .p2-box { color: #f87171; }
  .stage-box { position: relative; }
  canvas { background: #1e293b; border-radius: 8px; }
  .overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(15, 23, 42, 0.95);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 15px;
    border-radius: 8px;
  }
  .hidden { display: none; }
  input {
    padding: 8px 12px;
    border-radius: 6px;
    border: none;
    font-size: 14px;
    font-weight: bold;
  }
  button {
    background: #feca57;
    color: #0f172a;
    border: none;
    padding: 10px 20px;
    border-radius: 6px;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
  }
</style>
</head>
<body>

<h1>🏎️ Race to 100 Points!</h1>
<p>Dodge cars to gain points. Crash and score goes back to 0! Reach 100 to WIN!</p>

<div class="hud">
  <div class="p1-box"><span id="p1-name-tag">Player 1</span>: <span id="p1-score">0</span> / 100</div>
  <div class="p2-box"><span id="p2-name-tag">Player 2</span>: <span id="p2-score">0</span> / 100</div>
</div>

<div class="stage-box">
  <canvas id="game" width="800" height="500"></canvas>

  <!-- Start Screen Overlay -->
  <div class="overlay" id="start-overlay">
    <h2>Driver Names</h2>
    <input type="text" id="p1-input" value="Lambo Driver" placeholder="Player 1 Name">
    <input type="text" id="p2-input" value="Bugatti Driver" placeholder="Player 2 Name">
    <button id="start-btn">Start Game</button>
  </div>

  <!-- Win Screen Overlay -->
  <div class="overlay hidden" id="win-overlay">
    <h2 id="winner-text" style="color: #feca57;">Winner!</h2>
    <button id="restart-btn">Play Again</button>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const p1ScoreEl = document.getElementById('p1-score');
const p2ScoreEl = document.getElementById('p2-score');
const p1NameTag = document.getElementById('p1-name-tag');
const p2NameTag = document.getElementById('p2-name-tag');

const startOverlay = document.getElementById('start-overlay');
const winOverlay = document.getElementById('win-overlay');
const winnerText = document.getElementById('winner-text');

let running = false;
let obstacles = [];
let keys = {};

// Player objects
const p1 = { x: 200, y: 400, w: 40, h: 60, score: 0, name: "Player 1", color: "#38bdf8" };
const p2 = { x: 600, y: 400, w: 40, h: 60, score: 0, name: "Player 2", color: "#f87171" };

document.getElementById('start-btn').onclick = () => {
  p1.name = document.getElementById('p1-input').value || "Player 1";
  p2.name = document.getElementById('p2-input').value || "Player 2";
  p1NameTag.textContent = p1.name;
  p2NameTag.textContent = p2.name;
  startOverlay.classList.add('hidden');
  resetGame();
};

document.getElementById('restart-btn').onclick = () => {
  winOverlay.classList.add('hidden');
  resetGame();
};

function resetGame() {
  p1.score = 0;
  p2.score = 0;
  p1.x = 200;
  p2.x = 600;
  obstacles = [];
  running = true;
  updateHUD();
}

window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

function spawnCar() {
  // P1 lane cars
  if (Math.random() < 0.03) {
    obstacles.push({ side: 'left', x: 120 + Math.random() * 160, y: -60, w: 35, h: 55, speed: 4 });
  }
  // P2 lane cars
  if (Math.random() < 0.03) {
    obstacles.push({ side: 'right', x: 520 + Math.random() * 160, y: -60, w: 35, h: 55, speed: 4 });
  }
}

function update() {
  if (!running) return;

  // Move P1 (Left / Right arrows)
  if (keys['arrowleft'] && p1.x > 110) p1.x -= 5;
  if (keys['arrowright'] && p1.x < 290) p1.x += 5;

  // Move P2 (A / D keys)
  if (keys['a'] && p2.x > 510) p2.x -= 5;
  if (keys['d'] && p2.x < 690) p2.x += 5;

  spawnCar();

  // Move obstacles and check collisions
  for (let i = obstacles.length - 1; i >= 0; i--) {
    let o = obstacles[i];
    o.y += o.speed;

    let player = o.side === 'left' ? p1 : p2;

    // Check hit/crash
    if (Math.abs(player.x - o.x) < 35 && Math.abs(player.y - o.y) < 50) {
      player.score = 0; // CRASH = SCORE RESET TO 0!
      obstacles.splice(i, 1);
      updateHUD();
      continue;
    }

    // Dodged car successfully = +5 Points!
    if (o.y > 500) {
      player.score += 5;
      obstacles.splice(i, 1);
      updateHUD();

      // WIN RULE: Reach 100 points to win!
      if (player.score >= 100) {
        running = false;
        winnerText.textContent = `🏆 ${player.name} Wins with 100 Points!`;
        winOverlay.classList.remove('hidden');
      }
    }
  }
}

function updateHUD() {
  p1ScoreEl.textContent = p1.score;
  p2ScoreEl.textContent = p2.score;
}

function draw() {
  ctx.clearRect(0, 0, 800, 500);

  // Roads
  ctx.fillStyle = "#0f172a";
  ctx.fillRect(100, 0, 200, 500);
  ctx.fillRect(500, 0, 200, 500);

  // Players
  ctx.fillStyle = p1.color;
  ctx.fillRect(p1.x - 20, p1.y - 30, p1.w, p1.h);

  ctx.fillStyle = p2.color;
  ctx.fillRect(p2.x - 20, p2.y - 30, p2.w, p2.h);

  // Obstacle cars
  ctx.fillStyle = "#feca57";
  for (let o of obstacles) {
    ctx.fillRect(o.x - 17, o.y - 27, o.w, o.h);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
