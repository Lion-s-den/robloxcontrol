<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2-Player Supercar Championship</title>
  <title>3-Player Supercar Championship</title>
  <title>4-Player Supercar Championship</title>
  <title>5-Player Supercar Championship</title>
  
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: #090d16;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 900px;
      height: 600px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 20px rgba(56, 189, 248, 0.2);
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #1e293b;
    }
    canvas {
      display: block;
      background: #000;
    }
    .hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 16px 24px;
      pointer-events: none;
      z-index: 10;
    }
    .hud-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 18px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 180px;
    }
    .hud-card.p1 { border-left: 4px solid #38bdf8; }
    .hud-card.p2 { border-left: 4px solid #ff2a6d; }
    .player-title {
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .p1 .player-title { color: #38bdf8; }
    .p2 .player-title { color: #ff2a6d; }
    .stat {
      font-size: 13px;
      color: #94a3b8;
    }
    .stat span {
      color: #fff;
      font-weight: 700;
      font-size: 15px;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(9, 13, 22, 0.92);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      padding: 32px;
      text-align: center;
    }
    .overlay.hidden {
      display: none;
    }
    .overlay h1 {
      font-size: 32px;
      margin-bottom: 12px;
      background: linear-gradient(to right, #38bdf8, #ff2a6d);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .overlay p {
      color: #94a3b8;
      font-size: 15px;
      margin-bottom: 24px;
      max-width: 480px;
      line-height: 1.5;
    }
    .inputs-group {
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
    }
    input[type="text"] {
      background: #1e293b;
      border: 1px solid #334155;
      color: #fff;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: #38bdf8;
    }
    .btn {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #fff;
      border: none;
      padding: 12px 32px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.1s, filter 0.2s;
    }
    .btn:hover {
      filter: brightness(1.15);
      transform: translateY(-1px);
    }
    .btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div class="hud">
      <div class="hud-card p1">
        <div id="p1-display-name" class="player-title">🔵 Player 1 (Lambo)</div>
        <div class="stat">Score: <span id="p1-score">0</span> / 100</div>
        <div class="stat">Stage: <span id="p1-stage">1</span></div>
      </div>
      <div class="hud-card p2">
        <div id="p2-display-name" class="player-title">🔴 Player 2 (Bugatti)</div>
        <div class="stat">Score: <span id="p2-score">0</span> / 100</div>
        <div class="stat">Stage: <span id="p2-stage">1</span></div>
      </div>
    </div>

    <canvas id="game" width="900" height="600"></canvas>

    <!-- Name Input Overlay -->
    <div id="name-overlay" class="overlay">
      <h1>Supercar Championship</h1>
      <p>Race head-to-head in real time! Reach 100 points first to win the stage and unlock supercar upgrades.</p>
      <div class="inputs-group">
        <input type="text" id="p1-input" placeholder="Player 1 Name" value="Player 1" />
        <input type="text" id="p2-input" placeholder="Player 2 Name" value="Player 2" />
      </div>
      <button id="start-game-btn" class="btn">Start Race</button>
    </div>

    <!-- Game Over / Stage Cleared Overlay -->
    <div id="gameover-overlay" class="overlay hidden">
      <h1 id="winner-title-text">Stage Cleared!</h1>
      <p id="summary-text"></p>
      <button id="restart-btn" class="btn">Next Stage</button>
    </div>
  </div>

  <script>
  (function() {
    const socket = io(); // Connects to server.js automatically

    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    const HALF = W / 2;
    const ROAD_MARGIN = 20;
    const LANES = 3;
    const STAGE_GOAL = 100;

    const nameOverlay = document.getElementById('name-overlay');
    const gameoverOverlay = document.getElementById('gameover-overlay');
    const startGameBtn = document.getElementById('start-game-btn');
    const restartBtn = document.getElementById('restart-btn');
    const p1Input = document.getElementById('p1-input');
    const p2Input = document.getElementById('p2-input');

    const p1DisplayName = document.getElementById('p1-display-name');
    const p2DisplayName = document.getElementById('p2-display-name');
    const p1ScoreEl = document.getElementById('p1-score');
    const p1StageEl = document.getElementById('p1-stage');
    const p2ScoreEl = document.getElementById('p2-score');
    const p2StageEl = document.getElementById('p2-stage');

    const winnerTitleText = document.getElementById('winner-title-text');
    const summaryText = document.getElementById('summary-text');
    const trafficColors = ['#feca57', '#1dd1a1', '#ff9ff3', '#a29bfe', '#ee5253'];

    let myRole = null; // 'Lamborghini' or 'Bugatti'
    let myPlayerId = null;

    // Listen for initial connection & role assignment from server.js
    socket.on('init', (data) => {
      myPlayerId = data.id;
      if (data.players[myPlayerId]) {
        myRole = data.players[myPlayerId].role;
        console.log(`Connected as: ${myRole}`);
      }
    });

    // --- AUDIO SYNTHESIZER ---
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
      if (!audioCtx) return;
      const t = audioCtx.currentTime;
      if (type === 'dodge') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(520, t);
        osc.frequency.setValueAtTime(680, t + 0.05);
        gain.gain.setValueAtTime(0.08, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(t); osc.stop(t + 0.1);
      } else if (type === 'crash') {
        const bufferSize = audioCtx.sampleRate * 0.3;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(600, t);
        filter.frequency.linearRampToValueAtTime(30, t + 0.3);
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.4, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.3);
        noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
        noise.start(t);
      }
    }

    function laneX(sideOffset, roadWidth, laneIndex) {
      const laneWidth = roadWidth / LANES;
      return sideOffset + ROAD_MARGIN + laneWidth * laneIndex + laneWidth / 2;
    }

    function createDriver(side, name) {
      const sideOffset = side === 'left' ? 0 : HALF;
      const roadWidth = HALF - ROAD_MARGIN * 2;
      return {
        side, name,
        lane: 1,
        sideOffset, roadWidth,
        carW: 46, carH: 80,
        x: laneX(sideOffset, roadWidth, 1),
        y: H - 110,
        score: 0, stage: 1, boost: false,
        switchCooldown: 0, hitCooldown: 0, stageCleared: false
      };
    }

    let p1, p2, obstacles, keysDown, running, spawnTimer, lastTime, roadLineOffset;

    function initChampionship() {
      initAudio();
      p1 = createDriver('left', p1Input.value.trim() || 'Player 1');
      p2 = createDriver('right', p2Input.value.trim() || 'Player 2');
      p1DisplayName.textContent = `🔵 ${p1.name} (Lambo)`;
      p2DisplayName.textContent = `🔴 ${p2.name} (Bugatti)`;
      nameOverlay.classList.add('hidden');
      startStageRound();
    }

    function startStageRound() {
      obstacles = [];
      keysDown = {};
      running = true;
      spawnTimer = 0;
      roadLineOffset = 0;
      lastTime = performance.now();
      p1.stageCleared = false;
      p2.stageCleared = false;
      gameoverOverlay.classList.add('hidden');
      updateHUD();
      requestAnimationFrame(loop);
    }

    function spawnObstacle(player) {
      const lane = Math.floor(Math.random() * LANES);
      const x = laneX(player.sideOffset, player.roadWidth, lane);
      const color = trafficColors[Math.floor(Math.random() * trafficColors.length)];
      obstacles.push({
        side: player.side,
        x, y: -90, w: 38, h: 68, color,
        speed: 3.8 + (player.stage * 0.15) + Math.random() * 2.0,
        passed: false, hit: false
      });
    }

    function rectsOverlap(a, b) {
      return Math.abs(a.x - b.x) < (a.carW || a.w) / 2 + b.w / 2 - 8 &&
             Math.abs(a.y - b.y) < (a.carH || a.h) / 2 + b.h / 2 - 8;
    }

    function updatePlayer(player, dt) {
      if (player.switchCooldown > 0) player.switchCooldown -= dt;
      if (player.hitCooldown > 0) player.hitCooldown -= dt;

      // Check if controls match assigned role
      const isP1 = player.side === 'left';
      const canControl = (isP1 && myRole === 'Lamborghini') || (!isP1 && myRole === 'Bugatti') || !myRole;

      if (canControl) {
        const leftKey = isP1 ? 'arrowleft' : 'a';
        const rightKey = isP1 ? 'arrowright' : 'd';
        const boostKey = isP1 ? 'arrowup' : 'w';
        const cool = Math.max(70, 130 - player.stage * 3);

        if (keysDown[leftKey] && player.switchCooldown <= 0) {
          if (player.lane > 0) { player.lane--; player.switchCooldown = cool; }
        }
        if (keysDown[rightKey] && player.switchCooldown <= 0) {
          if (player.lane < LANES - 1) { player.lane++; player.switchCooldown = cool; }
        }
        player.boost = !!keysDown[boostKey];

        // Emit movement to central server
        socket.emit('playerMove', { x: player.x, y: player.y, lane: player.lane });
      }

      const targetX = laneX(player.sideOffset, player.roadWidth, player.lane);
      player.x += (targetX - player.x) * (0.25 + Math.min(0.2, player.stage * 0.01));

      if (player.score >= STAGE_GOAL && !player.stageCleared) {
        player.stageCleared = true;
        finishStage(player);
      }
    }

    // Sync state received from server
    socket.on('stateUpdate', (players) => {
      Object.keys(players).forEach(id => {
        const pData = players[id];
        if (pData.role === 'Lamborghini' && myRole !== 'Lamborghini' && p1) {
          p1.lane = pData.lane || p1.lane;
        } else if (pData.role === 'Bugatti' && myRole !== 'Bugatti' && p2) {
          p2.lane = pData.lane || p2.lane;
        }
      });
    });

    function updateObstacles(dt) {
      const factor = dt / 16;
      for (const o of obstacles) {
        const boosted = (o.side === 'left' ? p1.boost : p2.boost);
        o.y += o.speed * factor * (boosted ? 1.8 : 1);
        const player = o.side === 'left' ? p1 : p2;

        if (!o.passed && !o.hit && o.y > player.y + player.carH / 2) {
          o.passed = true;
          player.score += 5;
          playSound('dodge');
        }

        if (!o.hit && rectsOverlap(player, o)) {
          o.hit = true;
          playSound('crash');
          player.score = 0;
          player.hitCooldown = 350;
        }
      }
      obstacles = obstacles.filter(o => o.y < H + 100);
    }

    function drawLamborghini3D(player) {
      const { x, y, carW: w, carH: h, hitCooldown, stage, boost } = player;
      ctx.save();
      ctx.translate(x, y);
      if (hitCooldown > 0) ctx.globalAlpha = 0.45;

      if (stage >= 2) {
        ctx.shadowColor = '#00d2ff';
        ctx.shadowBlur = 12 + Math.min(20, stage * 1.5);
        ctx.fillStyle = '#00d2ff';
        ctx.fillRect(-w/2 + 4, -h/2 + 10, w - 8, h - 20);
        ctx.shadowBlur = 0;
      }

      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.beginPath();
      ctx.ellipse(3, 8, w/1.5, h/1.6, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#111';
      ctx.fillRect(-w/2 - 3, -h/3, 5, 16);
      ctx.fillRect(w/2 - 2, -h/3, 5, 16);
      ctx.fillRect(-w/2 - 3, h/4, 5, 16);
      ctx.fillRect(w/2 - 2, h/4, 5, 16);

      const bodyGrad = ctx.createLinearGradient(-w/2, 0, w/2, 0);
      bodyGrad.addColorStop(0, '#0284c7');
      bodyGrad.addColorStop(0.3, '#38bdf8');
      bodyGrad.addColorStop(0.7, '#7dd3fc');
      bodyGrad.addColorStop(1, '#0369a1');
      ctx.fillStyle = bodyGrad;

      ctx.beginPath();
      ctx.moveTo(0, -h/2);
      ctx.lineTo(w/2 - 2, -h/3);
      ctx.lineTo(w/2, h/2 - 8);
      ctx.lineTo(w/2 - 6, h/2);
      ctx.lineTo(-w/2 + 6, h/2);
      ctx.lineTo(-w/2, h/2 - 8);
      ctx.lineTo(-w/2 + 2, -h/3);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = '#0284c7';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-w/2 + 6, -h/3); ctx.lineTo(-w/4, -h/6); ctx.lineTo(-w/4, h/4);
      ctx.moveTo(w/2 - 6, -h/3); ctx.lineTo(w/4, -h/6); ctx.lineTo(w/4, h/4);
      ctx.stroke();

      const cabinGrad = ctx.createLinearGradient(0, -h/4, 0, h/4);
      cabinGrad.addColorStop(0, '#0f172a');
      cabinGrad.addColorStop(1, '#1e293b');
      ctx.fillStyle = cabinGrad;
      ctx.beginPath();
      ctx.moveTo(0, -h/3.8);
      ctx.lineTo(w/3, -h/8);
      ctx.lineTo(w/3.5, h/4);
      ctx.lineTo(-w/3.5, h/4);
      ctx.lineTo(-w/3, -h/8);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = 'rgba(56, 189, 248, 0.75)';
      ctx.beginPath();
      ctx.moveTo(0, -h/3.8 + 2);
      ctx.lineTo(w/3 - 3, -h/8);
      ctx.lineTo(-w/3 + 3, -h/8);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = '#fef08a';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-w/2 + 5, -h/2 + 12); ctx.lineTo(-w/2 + 11, -h/2 + 10); ctx.lineTo(-w/2 + 11, -h/2 + 16);
      ctx.moveTo(w/2 - 5, -h/2 + 12); ctx.lineTo(w/2 - 11, -h/2 + 10); ctx.lineTo(w/2 - 11, -h/2 + 16);
      ctx.stroke();

      ctx.fillStyle = '#020617';
      ctx.fillRect(-w/2 - 2, h/2 - 6, w + 4, 6);
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(-w/2 - 2, h/2 - 6, 3, 6);
      ctx.fillRect(w/2 - 1, h/2 - 6, 3, 6);

      if (stage >= 3 && boost) {
        ctx.fillStyle = '#ff6b6b';
        ctx.beginPath();
        ctx.moveTo(-6, h/2); ctx.lineTo(0, h/2 + 18 + Math.random() * 8); ctx.lineTo(6, h/2);
        ctx.fill();
      }

      ctx.restore();
    }

    function drawBugatti3D(player) {
      const { x, y, carW: w, carH: h, hitCooldown, stage, boost } = player;
      ctx.save();
      ctx.translate(x, y);
      if (hitCooldown > 0) ctx.globalAlpha = 0.45;

      if (stage >= 2) {
        ctx.shadowColor = '#ff2a6d';
        ctx.shadowBlur = 12 + Math.min(20, stage * 1.5);
        ctx.fillStyle = '#ff2a6d';
        ctx.fillRect(-w/2 + 4, -h/2 + 10, w - 8, h - 20);
        ctx.shadowBlur = 0;
      }

      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.beginPath();
      ctx.ellipse(3, 8, w/1.5, h/1.6, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#111';
      ctx.fillRect(-w/2 - 3, -h/3, 5, 16);
      ctx.fillRect(w/2 - 2, -h/3, 5, 16);
      ctx.fillRect(-w/2 - 3, h/4, 5, 16);
      ctx.fillRect(w/2 - 2, h/4, 5, 16);

      const bodyGrad = ctx.createLinearGradient(-w/2, 0, w/2, 0);
      bodyGrad.addColorStop(0, '#7f1d1d');
      bodyGrad.addColorStop(0.3, '#dc2626');
      bodyGrad.addColorStop(0.7, '#f87171');
      bodyGrad.addColorStop(1, '#991b1b');
      ctx.fillStyle = bodyGrad;

      ctx.beginPath();
      ctx.roundRect(-w/2, -h/2, w, h, [16, 16, 12, 12]);
      ctx.fill();

      ctx.fillStyle = '#020617';
      ctx.beginPath();
      ctx.arc(0, -h/2 + 7, 8, 0, Math.PI);
      ctx.fill();

      ctx.strokeStyle = '#020617';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(-w/2 + 3, 0, h/3.2, -Math.PI/2, Math.PI/2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(w/2 - 3, 0, h/3.2, Math.PI/2, -Math.PI/2);
      ctx.stroke();

      const roofGrad = ctx.createLinearGradient(0, -h/4, 0, h/4);
      roofGrad.addColorStop(0, '#0f172a');
      roofGrad.addColorStop(1, '#334155');
      ctx.fillStyle = roofGrad;
      ctx.beginPath();
      ctx.roundRect(-w/3.2, -h/3.8, (w*2)/3.2, h/2, 8);
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(-w/2 + 6, -h/2 + 4, 10, 3);
      ctx.fillRect(w/2 - 16, -h/2 + 4, 10, 3);

      ctx.fillStyle = '#ff2a6d';
      ctx.fillRect(-w/2 + 4, h/2 - 4, w - 8, 3);

      if (stage >= 3 && boost) {
        ctx.fillStyle = '#feca57';
        ctx.beginPath();
        ctx.moveTo(-6, h/2); ctx.lineTo(0, h/2 + 18 + Math.random() * 8); ctx.lineTo(6, h/2);
        ctx.fill();
      }

      ctx.restore();
    }

    function drawObstacle3D(x, y, w, h, color) {
      ctx.save();
      ctx.translate(x, y);

      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fillRect(-w/2 + 3, -h/2 + 5, w, h);

      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.roundRect(-w/2, -h/2, w, h, 8);
      ctx.fill();

      ctx.fillStyle = 'rgba(15, 23, 42, 0.75)';
      ctx.fillRect(-w/3, -h/5, (w*2)/3, h/2.2);

      ctx.restore();
    }

    function drawRoad(sideOffset, roadWidth, offset) {
      const grad = ctx.createLinearGradient(sideOffset, 0, sideOffset, H);
      grad.addColorStop(0, '#111827');
      grad.addColorStop(1, '#030712');
      ctx.fillStyle = grad;
      ctx.fillRect(sideOffset, 0, roadWidth + ROAD_MARGIN * 2, H);

      ctx.fillStyle = '#10b981';
      ctx.fillRect(sideOffset, 0, ROAD_MARGIN, H);
      ctx.fillRect(sideOffset + ROAD_MARGIN + roadWidth, 0, ROAD_MARGIN, H);

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.65)';
      ctx.lineWidth = 4;
      ctx.setLineDash([26, 22]);
      for (let i = 1; i < LANES; i++) {
        const x = sideOffset + ROAD_MARGIN + (roadWidth / LANES) * i;
        ctx.beginPath();
        ctx.moveTo(x, -22 + offset);
        ctx.lineTo(x, H);
        ctx.stroke();
      }
      ctx.setLineDash([]);
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      drawRoad(p1.sideOffset, p1.roadWidth, roadLineOffset);
      drawRoad(p2.sideOffset, p2.roadWidth, roadLineOffset);

      ctx.fillStyle = '#000';
      ctx.fillRect(HALF - 3, 0, 6, H);

      for (const o of obstacles) drawObstacle3D(o.x, o.y, o.w, o.h, o.color);

      drawLamborghini3D(p1);
      drawBugatti3D(p2);

      updateHUD();
    }

    function updateHUD() {
      p1ScoreEl.textContent = Math.floor(p1.score);
      p1StageEl.textContent = p1.stage;

      p2ScoreEl.textContent = Math.floor(p2.score);
      p2StageEl.textContent = p2.stage;
    }

    function finishStage(winner) {
      running = false;
      winnerTitleText.textContent = `🏆 ${winner.name} Cleared Stage ${winner.stage}!`;
      const nextStage = winner.stage + 1;

      summaryText.innerHTML = `
        <strong>${winner.name}</strong> reached <strong>100 points</strong> and won Stage ${winner.stage}!<br><br>
        🔧 <strong>Supercar Upgraded:</strong> Performance & Handling Boosted!
      `;

      p1.stage++;
      p2.stage++;
      restartBtn.textContent = `Play Stage ${nextStage}`;

      p1.score = 0;
      p2.score = 0;
      gameoverOverlay.classList.remove('hidden');
    }

    function loop(now) {
      if (!running) return;
      const dt = Math.min(now - lastTime, 40);
      lastTime = now;

      roadLineOffset = (roadLineOffset + dt * 0.38) % 48;

      updatePlayer(p1, dt);
      updatePlayer(p2, dt);

      spawnTimer += dt;
      if (spawnTimer > 460) {
        spawnTimer = 0;
        spawnObstacle(p1);
        spawnObstacle(p2);
      }

      updateObstacles(dt);
      draw();

      requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', (e) => {
      initAudio();
      const key = e.key.toLowerCase();
      keysDown[key] = true;
      if (['arrowleft', 'arrowright', 'arrowup', 'arrowdown', 'w', 'a', 's', 'd'].includes(key)) {
        e.preventDefault();
      }
    });

    window.addEventListener('keyup', (e) => { keysDown[e.key.toLowerCase()] = false; });

    startGameBtn.addEventListener('click', initChampionship);
    restartBtn.addEventListener('click', startStageRound);
  })();
  </script>
</body>
</html>
